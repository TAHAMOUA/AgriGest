services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrigest-app
    ports:
      - "8000:8000"
    environment:
      APP_KEY: "base64:Lc+Jaxgv+iZTARLc/sw3Fhl52WTqV97Z9lCQWj3sB9k="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: agrigest
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: agrigest-db
    environment:
      MYSQL_DATABASE: agrigest
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: